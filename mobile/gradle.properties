kotlin.code.style=official

# Backend base URL for release builds, read by composeApp/build.gradle.kts's
# "release" buildType. Defaults to the Railway production API; pass
# -PLIFEOS_API_BASE_URL=... on the command line to build against another
# backend for a single build. Debug builds ignore this and always use the
# local backend (http://10.0.2.2:3000/api/v1).
LIFEOS_API_BASE_URL=https://lifeos-production-532b.up.railway.app/api/v1

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose Multiplatform Gradle plugin
org.jetbrains.compose.experimental.uikit.enabled=true

# Gradle daemon performance
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
