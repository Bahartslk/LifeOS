kotlin.code.style=official

# Release builds read the backend base URL from this property (e.g. a
# deployed Railway/Render URL) instead of a hardcoded value — see
# composeApp/build.gradle.kts's "release" buildType. Uncomment and set your
# own, or pass -PLIFEOS_API_BASE_URL=... on the command line instead of
# committing it here.
LIFEOS_API_BASE_URL=https://lifeos-production-532b.up.railway.app/api/v1

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose Multiplatform Gradle plugin
org.jetbrains.compose.experimental.uikit.enabled=true

# Gradle daemon performance
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
